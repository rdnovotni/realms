# Disposable cache: complete loss is expected and safe.
bind 0.0.0.0
protected-mode yes
port 6379
aclfile /run/secrets/cache_acl
maxmemory 128mb
maxmemory-policy allkeys-lru
maxmemory-clients 16mb
maxclients 64
save ""
appendonly no
stop-writes-on-bgsave-error no
logfile ""
loglevel notice
dir /tmp
