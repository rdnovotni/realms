name: ${COMPOSE_PROJECT_NAME:?Set a unique project name}
x-app: &app
  image: ${KOL_IMAGE:?Build a versioned KoL image first}
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  networks: [private]
  pids_limit: 128
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: ${DB_NAME:?Explicit project database required}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql]
    networks: [private]
    restart: unless-stopped
    mem_limit: ${DB_MEMORY:-1g}
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 256
    shm_size: 128m
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB,
      -c, password_encryption=scram-sha-256, -c, log_connections=on, -c, log_disconnections=on,
      -c, log_lock_waits=on, -c, log_min_duration_statement=250, -c, log_statement=none,
      -c, log_min_error_statement=panic, -c, log_parameter_max_length=0,
      -c, log_parameter_max_length_on_error=0, -c, idle_in_transaction_session_timeout=60s]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 24
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  bootstrap:
    <<: *app
    profiles: [setup]
    environment: {DB_NAME: "${DB_NAME}"}
    command: [node, container/bootstrap.mjs]
    secrets: [db_password, migration_password, app_password, worker_password, scheduler_password]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  setup:
    <<: *app
    profiles: [setup]
    environment: {DB_NAME: "${DB_NAME}"}
    command: [node, container/setup.mjs]
    secrets: [migration_password]
    mem_limit: 512m
    cpus: 0.5
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  verify:
    <<: *app
    profiles: [tools]
    environment: {DB_NAME: "${DB_NAME}"}
    command: [node, container/database-check.mjs, full]
    secrets: [migration_password, app_password]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    stop_grace_period: 45s
    networks: [private, frontend]
    secrets: [app_password, throttle_key, cache_password, ingress_key]
    environment:
      DB_NAME: "${DB_NAME}"
      CACHE_NAMESPACE: "${COMPOSE_PROJECT_NAME}"
      INGRESS_KEY_FILE: /run/secrets/ingress_key
      API_REQUESTS_PER_MINUTE: "${API_REQUESTS_PER_MINUTE:-120}"
    ports: ["127.0.0.1:${HTTP_PORT:?Set unique localhost port}:3000"]
    restart: unless-stopped
    mem_limit: ${API_MEMORY:-512m}
    mem_reservation: 128m
    cpus: 1.0
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, container/health.mjs]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  cache:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    command: [valkey-server, /etc/kol-cache/valkey.conf]
    volumes: ["./cache/valkey.conf:/etc/kol-cache/valkey.conf:ro"]
    secrets: [cache_acl, cache_password]
    networks: [private]
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, 'VALKEYCLI_AUTH=$$(cat /run/secrets/cache_password) valkey-cli --user cache -h 127.0.0.1 PING | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  worker:
    <<: *app
    environment: {DB_NAME: "${DB_NAME}", CACHE_NAMESPACE: "${COMPOSE_PROJECT_NAME}"}
    command: [node, container/worker.mjs]
    secrets: [worker_password, cache_password]
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, container/worker-health.mjs]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
  jobs-check:
    <<: *app
    profiles: [tools]
    environment: {DB_NAME: "${DB_NAME}", CACHE_NAMESPACE: "${COMPOSE_PROJECT_NAME}"}
    command: [node, container/jobs-check.mjs, full]
    secrets: [migration_password, worker_password, cache_password, cache_admin_password]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_healthy}
  scheduler:
    <<: *app
    command: [node, container/scheduler.mjs]
    environment: {DB_NAME: "${DB_NAME}", SCHEDULER_BATCH: "${SCHEDULER_BATCH:-50}"}
    secrets: [scheduler_password]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, container/scheduler-health.mjs]
      interval: 10s
      timeout: 3s
      retries: 6
  scheduler-admin:
    <<: *app
    profiles: [tools]
    command: [node, container/scheduler-admin.mjs, report]
    environment: {DB_NAME: "${DB_NAME}"}
    secrets: [migration_password, scheduler_password]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    healthcheck: {disable: true}
  scheduler-check:
    <<: *app
    profiles: [tools]
    command: [node, container/scheduler-check.mjs, initial]
    environment: {DB_NAME: "${DB_NAME}"}
    secrets: [migration_password, scheduler_password]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    healthcheck: {disable: true}
  backend-smoke:
    <<: *app
    profiles: [tools]
    environment: {DB_NAME: "${DB_NAME}", CACHE_NAMESPACE: "${COMPOSE_PROJECT_NAME}"}
    command: [node, container/backend-smoke.mjs]
    secrets: [app_password, cache_password]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
networks:
  frontend:
    driver_opts: {com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"}
  private:
    internal: true
    driver_opts: {com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"}
  # No host database port: administration is through the local Docker socket.
volumes:
  database:
    name: ${DB_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_database}
    external: ${DB_VOLUME_EXTERNAL:-false}
secrets:
  ingress_key: {file: ./secrets/ingress_key}
  scheduler_password: {file: ./secrets/scheduler_password}
  db_password: {file: ./secrets/db_password}
  migration_password: {file: ./secrets/migration_password}
  app_password: {file: ./secrets/app_password}
  throttle_key: {file: ./secrets/throttle_key}
  worker_password: {file: ./secrets/worker_password}
  cache_password: {file: ./secrets/cache_password}
  cache_admin_password: {file: ./secrets/cache_admin_password}
  cache_acl: {file: ./secrets/cache_acl}
