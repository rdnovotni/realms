name: Server checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: realms
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: realms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realms -d realms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://realms:ci-only-password@127.0.0.1:5432/realms_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
