name: Server checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: realms
    services:
      postgres:
        # Match the reviewed deployment version and immutable image identity.
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: realms
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: realms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realms -d realms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://realms:ci-only-password@127.0.0.1:5432/realms_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: realms/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm run styles:check
      - name: Frozen visual source and browser contract
        run: npm run visual:check
      - run: npm run content:check
      - name: Design coverage and implementation contracts
        run: npm run features:check
      - name: Documentation navigation and API coverage
        run: python3 ../infra/scripts/documentation-check.py
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:workers
      - run: npm run test:runtime
      - name: Install infrastructure test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk restic
      - name: Infrastructure regression checks
        run: python3 -m unittest discover -s ../infra/tests
      - run: python3 -m py_compile ../infra/development_client/*.py ../infra/control_panel/*.py ../infra/scripts/*.py
      - run: npm run build
  checkpoint-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: realms
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: realms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realms -d realms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: realms/package-lock.json
      - run: npm ci
        working-directory: realms
      - name: Rehearse historical upgrade and logical restore on disposable data
        env:
          TEST_DATABASE_URL: postgresql://realms:ci-only-password@127.0.0.1:5432/realms_test
          M00_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          baseline=$(mktemp -d)
          pg_bin=$(mktemp -d)
          git archive 470b8ae9e6c1cb06c2d49d0e6aed6dc52fc29a7e | tar -x -C "$baseline"
          ln -s "$GITHUB_WORKSPACE/realms/node_modules" "$baseline/realms/node_modules"
          chmod +x infra/scripts/checkpoint-pg-client.py
          ln -s "$GITHUB_WORKSPACE/infra/scripts/checkpoint-pg-client.py" "$pg_bin/pg_dump"
          ln -s "$GITHUB_WORKSPACE/infra/scripts/checkpoint-pg-client.py" "$pg_bin/pg_restore"
          export PG_BINDIR="$pg_bin"
          export M00_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})
          cd realms
          node --import tsx scripts/checkpoint-rehearsal.mjs --baseline "$baseline/realms" --receipt "$RUNNER_TEMP/m00-rehearsal.json" --confirm-disposable
      - uses: actions/upload-artifact@v4
        with:
          name: m00-checkpoint-rehearsal
          path: ${{ runner.temp }}/m00-rehearsal.json
          if-no-files-found: error
  release-verification:
    needs: [server, checkpoint-rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify the frozen release checkpoint with disposable PostgreSQL
        run: python3 infra/scripts/verify-checkpoint.py --source-commit "$GITHUB_SHA"
